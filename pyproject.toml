[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrom-mesh"
dynamic = "0.1.0"
authors = [
    { name = "Tao Hongxu", email = "kq_thx@163.com" }
]
description = "A toolkit for analyzing chromatin multi-enhancer loop networks and gene regulation"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = [
    "bioinformatics", "genomics", "chromatin", "3D genome", 
    "enhancer", "promoter", "gene regulation", "Hi-C", "ChIP-seq", "ATAC-seq"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]


dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "networkx>=2.6.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/159thx/Chrom-MESH"
Repository = "https://github.com/159thx/Chrom-MESH"

[project.optional-dependencies]

dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]
goatools = [
    "goatools>=1.0",
]

[project.scripts]

chrom-mesh = "chrom_mesh.cli:main"


[tool.setuptools]
packages = ["chrom_mesh", "chrom_mesh.core", "chrom_mesh.scripts", "chrom_mesh.utils"]
include-package-data = true

[tool.setuptools.package-data]
chrom_mesh = ["scripts/*.sh", "data/*", "data/*/*", "data/*/*/*"]

[tool.setuptools.dynamic]

version = { attr = "chrom_mesh.__version__.__version__" }
